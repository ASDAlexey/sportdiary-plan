[package]
name = "runkit"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
gpx = "0.10"
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
serde_json = "1"
time = "0.3"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
