    notes: "Задача — вернуться к смене темпа с запасом сил перед группой; это не пороговая и не МПК-сессия Дэниелса. Всего около 8 км, ориентир RPE 5–6. Первый отрезок ближе к 4:55/км; следующие — в том же контролируемом усилии, без обязательного ускорения. После 3 км разминки оценить самочувствие: при тяжести вместо отрезков продолжить лёгкий бег. Между отрезками 2 мин трусцой, пульс снижать к 150 и ниже; при необходимости восстановление продлить. Пульс к концу отрезков 169–178 — дополнительный ориентир, не разгоняться ради цифры; при меньшем пульсе темп не повышать. Если пульс устойчиво выше 178, снизить темп. При усталости убрать отрезки и сократить бег по самочувствию; при боли тренировку отменить. Темп 4:48 в структуре — ориентир внутри диапазона, а не обязательный темп первого отрезка."
