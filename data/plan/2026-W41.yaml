notes: "Первую полную неделю после паузы держать умеренной: Первоначальный верхний ориентир был около 48,4 км. После пропуска среды 07.10 объём не добирать. По факту Пн/Вт/Чт уже 30,95802 км; с двумя оставшимися кроссами по 8 км было бы около 47 км, но это не цель для добора. Предыдущая неделя 12,68 км, три недели до паузы в среднем 63,54 км. После восстановления правило роста на 10% не применяется; объём по самочувствию. Управляемая умеренная работа одна — вторник; четверг — сокращённая группа, суббота — лёгкий кросс вместо горок. Содержание группы заранее не назначается. При боли отменить качество и сократить неделю. Отпуск в Египте 10–19 октября — отдых, бег только по желанию; вылет 10.10 вечером."
