notes: "12–18 октября — отдых в Египте, внутри отпуска 10–19 октября. Все четыре беговых слота необязательны: можно бегать реже или полностью отдыхать всю неделю. Целевого недельного объёма нет; четыре выхода по 8 км дали бы 32 км, но это не задание. Только утренний лёгкий бег по самочувствию, не каждый день; пульс 130–149, в пятницу 120–140 уд/мин, свободный разговор и RPE 2–3. Эти диапазоны — ориентиры текущего плана, а не номера книжных зон. Темп в жаре может быть медленнее обычного; не пытаться удерживать привычный темп или добирать нижнюю границу пульса. Выбирать более прохладное время и доступ к воде; при перегреве, головокружении или необычной слабости закончить бег. При боли в спине, пятке или колене прекратить пробежку и пересмотреть оставшиеся дни. Без групп, интервалов, спринта, ускорений и горок; пропущенную работу не компенсировать."
