notes: "Coros: 13,85862 км за 1:21:30, полное время 1:47:48; средний пульс 155, максимум 181, набор 15 м. Аэробный эффект 3,2, анаэробный 2,9, нагрузка 164, средний каденс 150. Со слов спортсмена: «сегодня отлично побегал». Численный RPE и состояние спины, пятки и колена не сообщены. По кругам: первые 4 км примерно за 24:10, средний пульс 140 / 142 / 142 / 146 по километрам; затем подготовительная часть и серии коротких рабочих участков с восстановлением. В записи видны повторяющиеся рабочие длительности около 10–15, 20–25 и 46–51 секунд; пульс на многих рабочих участках 169–180. Спортсмен подтвердил схему: 10×(50 м быстро / 50 м медленно), 10×(100 / 100), 10×(200 / 200). Разминка, подготовительная часть, восстановление и заминка не входят в приведённый ниже итог быстрых отрезков. Суммы 10 основных рабочих кругов каждой серии: 50 м — 123,84 с на номинальные 500 м (средний темп 4:08/км); 100 м — 222,61 с на 1000 м (3:43/км); 200 м — 487,62 с на 2000 м (4:04/км). Всего быстро: 3500 м по подтверждённым дистанциям, 834,07 с = 13:54,07, средний темп 3:58/км. Темп рассчитан как сумма времени / сумма номинальных дистанций, а не среднее темпов отдельных кругов. GPS-дистанции выбранных кругов суммарно 3342,07 м, поэтому расчёт по GPS дал бы около 4:10/км; на коротких отрезках используем названные спортсменом дистанции, но они не измерены здесь независимо. После последнего основного рабочего круга есть дополнительные 3,96 и 8,78 с; их принадлежность последнему повтору не подтверждена, они исключены из рабочего итога. Это создаёт неопределённость нескольких секунд в границе последнего повторения; сумма относится к отмеченным рабочим кругам, а не к доказанной полной длительности каждого номинального отрезка. Детальные круги сохранены локально в raw/. Разные представления заминки расходятся по среднему пульсу первого километра, поэтому не выбран один из них как подтверждённый. Объём больше плановых около 8 км; максимум пульса ниже планового ограничения 187, но это не подтверждает заданный RPE."
