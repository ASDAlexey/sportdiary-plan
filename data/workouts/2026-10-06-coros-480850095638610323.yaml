notes: "По Coros: 8,7304 км за 47:59, полное время 57:22; пульс средний 157, максимум 180, набор 21 м. Аэробный эффект 2,5, анаэробный 1,1, нагрузка 84. Средний каденс всей смешанной пробежки 154 шаг/мин, на двух явно быстрых ручных кругах 160 и 162; это не замер привычного каденса при постоянном лёгком темпе. Первые 3 км: 5:49 / 5:20 / 5:51, средний пульс по километрам 138 / 152 / 151. Ручные круги после разминки включают 690,08 м за 3:05 (4:28/км, средний пульс 173, максимум 179) и 854,67 м за 3:58 (4:38/км, средний 173, максимум 180). Эти круги быстрее плановых 4:40–4:55; длительности не равны трём плановым отрезкам по 3 минуты. Полная структура 3×3 минуты пока не подтверждена, поэтому не восстановлена предположительно. На отдельных промежуточных кругах средний пульс 166, но пульс в конце восстановления из этой таблицы не установлен. Заминка по последним кругам: средний пульс около 152. Ощущения, RPE и состояние спины, пятки и колена после тренировки пока не сообщены. Дополнительная проверка исходного FIT 07.10: между двумя явно быстрыми ручными кругами есть третий быстрый участок. Его границы оценены по переходу скорости примерно 16:30:51–16:34:01 UTC: около 3:10, 0,678 км, темп около 4:40/км, средний пульс около 171, максимум 180. Это оценка по записи, не отдельный подтверждённый круг. В порядке выполнения быстрые участки: первый 3:05 / 0,69008 км / 4:28, второй примерно 3:10 / 0,678 км / 4:40, третий 3:58 / 0,85467 км / 4:38. Третий оказался длиннее плановых 3 минут; точная причина не сообщена."
